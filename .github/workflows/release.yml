name: Release Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests before release
        run: pytest
      - name: Build executable
        run: pyinstaller --onefile --name "symulator-skrzyzowania-${{ github.ref_name }}" src/main.py
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "dist/symulator-skrzyzowania-${{ github.ref_name }}.exe" --title "Wydanie ${{ github.ref_name }}" --notes "Paczka wydania dla wersji ${{ github.ref_name }}"